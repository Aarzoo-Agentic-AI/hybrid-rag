# Policy registry: metadata for each policy PDF in this folder.
#
# The policy owner maintains these values; ingestion never guesses them from the text. Each
# entry was transcribed from the policy's cover page and "Document Control" table. Changing an
# entry re-indexes that policy on the next `scripts/ingest.py` run (no re-parsing needed).
#
# Fields: policy_name, policy_id, policy_category, version, effective_date, is_current,
# jurisdiction, applies_to, owner_department, review_date, language, and access.
#
# access: who may read the policy (FEATURE.md section 11). Merged key by key with the access
# block in `defaults`; anything unset takes the most closed value (deny by default).
#   classification: public | internal | confidential | restricted   (a ceiling: the caller's
#                   clearance must be at least this)
#   visibility:     tenant (everyone in the tenant) | restricted (only the grants below)
#   allowed_groups / allowed_roles / allowed_users: grants; any one is enough
# Changing only `access` updates the stored chunks in place on the next ingest: nothing is
# parsed or embedded again. The tenant comes from documents.tenant_id (or --tenant).

defaults:
  jurisdiction: US
  language: en
  is_current: true
  applies_to: [employees, interns]
  access:
    classification: internal       # for employees, not for the public
    visibility: tenant

policies:
  HR_Policy_Handbook_2027.pdf:
    policy_name: HR Policy Handbook
    policy_category: handbook
    version: "1.0"
    effective_date: 2027-01-01
    owner_department: People (Chief People Officer)
    review_date: 2028-01-01          # reviewed annually
    corrections:                     # parser errors no general rule can fix (see cleanup.py)
      - find: "Acknowledgment form marital status"
        replace: "marital status"
        reason: >-
          Docling reads the second column of the contents page after section 2; the last
          contents entry ("Acknowledgment form") is fused into the sentence it interrupts.

  Employee_Benefits_Guide_2027.pdf:
    policy_name: Employee Benefits Guide
    policy_category: benefits
    version: "Plan Year 2027"
    effective_date: 2027-01-01
    applies_to: [eligible_employees]
    owner_department: People (Benefits)
    review_date: 2027-10-01          # before open enrollment for the next plan year

  Travel_Policy.pdf:
    policy_name: Travel Policy
    policy_id: HR-TRV-003
    policy_category: travel
    effective_date: 2027-01-01
    owner_department: People (Chief People Officer) with Finance
    review_date: 2028-01-01

  Expense_Policy.pdf:
    policy_name: Expense Policy
    policy_id: HR-EXP-004
    policy_category: expenses
    effective_date: 2027-01-01
    owner_department: People (Chief People Officer) with Finance
    review_date: 2028-01-01

  Annual_Review_Merit_Bonus_Policy_2027.pdf:
    policy_name: Annual Review, Merit Increase and Performance Bonus Policy
    policy_id: HR-COMP-002
    policy_category: compensation
    effective_date: 2027-01-01
    applies_to: [employees]
    owner_department: Total Rewards
    review_date: 2027-10-01          # annually, before budgets are set each Q4
    access:                          # merit matrix, bonus targets and calibration rules
      classification: confidential
      visibility: restricted
      allowed_groups: [hr-compensation]
      allowed_roles: [people_manager, hr_director]
