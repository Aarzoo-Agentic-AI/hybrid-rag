# Pipeline settings. Secrets (API keys) belong in .env, not here.
# Any value can be overridden with an environment variable using the HYBRID_RAG_ prefix
# and "__" between levels, e.g. HYBRID_RAG_QDRANT__URL=http://qdrant:6333

qdrant:
  url: http://localhost:6333
  collection: documents

embedding:
  provider: bge-m3       # "bge-m3" (real model, ~2.3 GB download) or "hashing" (tiny test stand-in)
  model: BAAI/bge-m3
  batch_size: 16
  max_length: 1024       # tokens per chunk; longer text is truncated
  device: cpu            # "cpu" or "cuda"
  cache_size: 4096       # encoded texts kept in memory

reranker:
  enabled: true
  # MiniLM: ~4 s per query on a laptop CPU, English only. On a GPU, use
  # BAAI/bge-reranker-v2-m3 (multilingual, stronger; max_length 1024): ~60 s per query on CPU.
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  device: cpu
  batch_size: 8          # query-chunk pairs scored at once
  max_length: 512        # tokens per pair (the model's limit)

documents:
  path: data/pdfs                    # default folder for scripts/ingest.py
  tenant_id: dummymocktest           # the organisation these policies belong to
  registry: data/pdfs/registry.yaml  # policy metadata per file (name, category, dates, ...)
  parser: docling                    # docling (layout-aware) | pypdf (fast, text only)
  access_overrides: .data/access_overrides.json  # permission changes made through the API
  cache_dir: .cache/parsed           # parsed PDFs, keyed by file hash (Docling is slow)

chunking:
  # Section-aware: a section up to max_tokens stays whole; longer ones are split near
  # target_tokens at paragraph, list-item or table-row boundaries, with overlap only
  # inside the section. Tokens are counted with the embedding model's tokenizer.
  target_tokens: 400
  max_tokens: 800
  overlap_tokens: 60
  tokenizer: BAAI/bge-m3     # or "approx" (4 characters per token)
  contextual_headers: true   # prepend "Policy: ... / Section: ..." to each chunk
  skip_sections: ['^contents$', "^what's inside$", 'acknowledge?ment']   # not indexed
  definition_sections: ['definitions?', 'glossary']   # table rows -> one chunk per term

privacy:
  # Sensitive data is handled before chunking and checked again after; nothing sensitive is
  # embedded, stored or traced. See src/hybrid_rag/privacy/README.md.
  enabled: true
  detector: presidio         # presidio (patterns + spaCy names) | patterns (regex only)
  spacy_model: en_core_web_sm
  score_threshold: 0.5
  redact: [PERSON, EMAIL_ADDRESS, PHONE_NUMBER, EMPLOYEE_ID]           # -> <PERSON>, <EMAIL>, ...
  quarantine: [US_SSN, CREDIT_CARD, IBAN_CODE, US_BANK_NUMBER, US_PASSPORT, US_ITIN]  # not indexed
  employee_id_pattern: '\bEMP-?\d{5,7}\b'
  allowlist:                 # shared business contacts that answers should keep
    - hr@dummymocktest.example
  allowlist_patterns: []

retrieval:
  mode: hybrid_rerank    # dense | sparse | hybrid | hybrid_rerank
  dense_limit: 50        # candidates from dense search
  sparse_limit: 50       # candidates from sparse search
  fused_limit: 20        # candidates kept after RRF, passed to the reranker
  top_k: 6               # chunks sent to the LLM
  expand_sections: true  # small-to-big: return the whole section for a hit on part of it
  max_section_tokens: 1500

answer:
  context_max_tokens: 3000   # sources in the prompt, in tokens
  # Below this top rerank score: "not found", without calling the LLM. The scale depends on
  # reranker.model; -8.5 is calibrated for ms-marco-MiniLM-L-6-v2. null to turn it off.
  min_rerank_score: -8.5
  max_history_turns: 6       # chat history used to rewrite follow-up questions
  contact: the HR Service Center

api:
  keys_file: api_keys.yaml       # created by scripts/make_api_key.py; git-ignored
  audit_log: logs/audit.jsonl
  audit_questions: false         # true: also store the (redacted) question text
  max_upload_mb: 25
  max_files_per_upload: 10
  warmup: true                   # load the models at startup
  json_logs: true

llm:
  # Ordered lists: the first entry is the primary, the rest are fallbacks.
  # Providers without an API key in .env are skipped, so Anthropic stays inactive until
  # ANTHROPIC_API_KEY is set.
  answer:
    - {provider: openai, model: gpt-5, reasoning_effort: low}  # answers come from given sources
    - {provider: anthropic, model: claude-sonnet-5-5}
  query_rewrite:
    - {provider: openai, model: gpt-5-mini, reasoning_effort: minimal}
    - {provider: anthropic, model: claude-haiku-5-5}
  request_timeout_s: 60
  overall_deadline_s: 120
  retry:
    max_attempts: 3
    base_delay_s: 0.5
    max_delay_s: 8
  circuit_breaker:
    failure_threshold: 5
    cooldown_s: 30
