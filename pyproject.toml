[project]
name = "hybrid-rag"
version = "0.1.0"
description = "Hybrid RAG with LangChain: dense + sparse retrieval, reranking and LLM failover, served as an API"
readme = "README.md"
authors = [
    { name = "aarzoo.manoosi", email = "aarzoo.manoosi@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "docling>=2.150",
    "en-core-web-sm",
    "fastapi>=0.163.0",
    "flagembedding>=1.4.2",
    "langchain-anthropic>=1.7.10",
    "langchain-classic>=1.0.8",
    "langchain-core>=1.8.0",
    "langchain-openai>=1.8.0",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "langsmith>=0.14.17",
    "openai>=3.51.0",
    "presidio-analyzer>=2.2",
    "pydantic-settings>=2.16.3",
    "pypdf>=7.1.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.20.0",
    "sentence-transformers>=6.3.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: tests that need external services (Qdrant, LLM APIs, model downloads)",
]
addopts = "-m 'not integration'"
filterwarnings = [
    # Expected with QdrantClient(":memory:") in unit tests; the real server uses the indexes.
    "ignore:Payload indexes have no effect in the local Qdrant:UserWarning",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
