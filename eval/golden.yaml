# Golden dataset: HR questions with the policy sections that answer them.
#
# Used by eval/evaluate.py (see eval/README.md). Each question has:
#   id        unique, <policy>-<topic>
#   question  as an employee would ask it
#   category  fact | table_lookup | exception | cross_policy | definition | follow_up | access |
#             unanswerable
#   style     keyword (uses the policy's own words) | paraphrase (deliberately reworded)
#   caller    who asks: employee (default), manager, hr-comp or admin (demo principals)
#   expected  what retrieval must find. Each item is one requirement; a list item gives
#             alternatives, any of which meets it. A label is "<source alias>::<section path>",
#             the section path exactly as indexed (scripts/search.py shows it).
#   facts     for --answers: text the answer must contain; "a|b" means either. Matching
#             ignores case, dash style and thousands separators.
#   history   follow_up only: the earlier turns. standalone: the question rewritten by hand,
#             used for retrieval scoring (--answers uses the real rewrite).
#   hidden_from  callers who must NOT get this question's sources (leakage check).
#
# Unanswerable questions have no expected sections: the right result is a refusal.

version: 1

sources:
  hb: HR_Policy_Handbook_2027.pdf
  ben: Employee_Benefits_Guide_2027.pdf
  trv: Travel_Policy.pdf
  exp: Expense_Policy.pdf
  merit: Annual_Review_Merit_Bonus_Policy_2027.pdf

